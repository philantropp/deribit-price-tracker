x-app: &app
  build:
    context: .
    target: runtime
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prices}:${POSTGRES_PASSWORD:-prices}@db:5432/${POSTGRES_DB:-prices}
    CELERY_BROKER_URL: redis://redis:6379/0
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prices}
      POSTGRES_DB: ${POSTGRES_DB:-prices}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prices}:${POSTGRES_PASSWORD:-prices}@db:5432/${POSTGRES_DB:-prices}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data:
